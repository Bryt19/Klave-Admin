<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="vertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D287"/>
      <stop offset="100%" stop-color="#00B06F"/>
    </linearGradient>
    <linearGradient id="horizGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- Vertical Teal/Green Pill -->
  <rect x="14" y="4" width="12" height="32" rx="6" fill="url(#vertGrad)" />
  <!-- Horizontal Cyan/Blue Pill -->
  <rect x="4" y="14" width="32" height="12" rx="6" fill="url(#horizGrad)" />
  <!-- Center Intersection with subtle blend -->
  <rect x="14" y="14" width="12" height="12" rx="2" fill="#0083B0" opacity="0.85" />
</svg>